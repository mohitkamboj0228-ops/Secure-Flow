apiVersion: apps/v1
kind: Deployment
metadata:
  name: secureflow-backend
  namespace: secureflow
  labels:
    app: backend-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: backend
        image: secureflow-backend:latest
        imagePullPolicy: Never # Local development image
        ports:
        - containerPort: 5000
          name: http
        envFrom:
        - configMapRef:
            name: secureflow-config
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: secureflow-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secureflow-secrets
              key: DB_PASSWORD
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: tmp-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: secureflow-backend
  namespace: secureflow
spec:
  ports:
  - port: 5000
    targetPort: 5000
    name: http
  selector:
    app: backend-api
