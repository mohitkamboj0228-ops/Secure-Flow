apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: secureflow-backend-hpa
  namespace: secureflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: secureflow-backend
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
