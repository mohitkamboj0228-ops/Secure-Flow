name: Deploy Control Plane to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Create Clean Static Web Directory
        run: |
          mkdir public_html
          cp index.html public_html/
          cp styles.css public_html/
          cp app.js public_html/

      - name: Setup GitHub Pages Configurations
        uses: actions/configure-pages@v4

      - name: Upload Static Web Assets
        uses: actions/upload-pages-artifact@v3
        with:
          # Only deploy the clean public_html folder
          path: './public_html'

      - name: Deploy static assets to Pages
        id: deployment
        uses: actions/deploy-pages@v4
